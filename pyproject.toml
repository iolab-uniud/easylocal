# Python tooling for the scripts/ directory, managed with uv:
#
#     uv sync                                  # create .venv from uv.lock
#     uv run scripts/tui-snapshots.py <tui>    # run a script in that environment
#     uv run pytest tests/tui                  # TUI end-to-end tests
#     uv run mkdocs serve                      # documentation site preview
#     uv run --group pdf scripts/docs-pdf.py   # one PDF per section of the site
#     scripts/format.sh, scripts/tidy.sh       # clang-format / clang-tidy
#
# The library itself is C++ and does not depend on any of this.
[project]
name = "easylocal-scripts"
version = "0.0.0"
description = "Development scripts of EasyLocal (docs snippets, TUI screenshots, coverage, formatting and linting)"
requires-python = ">=3.10"
dependencies = [
    "gcovr>=8",  # coverage reports (scripts/coverage.sh)
    "pyte>=0.8",  # TUI driver (scripts/tui_driver.py): screenshots and e2e tests
    "pytest>=8",  # TUI end-to-end tests (tests/tui)
    "mkdocs>=1.6,<2",  # documentation site (mkdocs.yml); 2.0 drops the plugin and theme systems
    "mkdocs-material>=9.5",
    # The print page each section PDF is printed from (scripts/docs-pdf.py);
    # it is off unless MKDOCS_PRINT_SITE says otherwise.
    "mkdocs-print-site-plugin>=2.9",
    # Pinned: a new release may format or diagnose differently.
    "clang-format==23.1.2",  # .clang-format (scripts/format.sh, .githooks/pre-commit)
    "clang-tidy==22.1.8",  # .clang-tidy (scripts/tidy.sh)
]

[tool.uv]
package = false

# Optional: the headless browser scripts/docs-pdf.py prints the section PDFs
# with, when it is installed (an installed Chrome or Chromium is the fallback):
#
#     uv sync --group pdf && uv run playwright install chromium
[dependency-groups]
pdf = ["playwright>=1.63"]
