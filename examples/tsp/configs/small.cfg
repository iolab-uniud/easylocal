# The parameters of easylocal_tsp_sa, read with --config: one path = value per
# line, with the paths that --help lists. A switch on the command line wins
# over the file.

# Simulated Annealing cools from the initial to the final temperature,
# multiplied by the cooling rate at each level; allowed_iterations is the
# proposals of the whole annealing, spread over its levels.
runners.sa.temperature.initial_temperature = 8.0
runners.sa.temperature.final_temperature = 0.25
runners.sa.temperature.cooling_rate = 0.9
runners.sa.temperature.allowed_iterations = 1000

# How often each neighborhood of the union proposes a move: three 2-opt moves
# for every swap.
neighborhood.random_biases = [3, 1]
