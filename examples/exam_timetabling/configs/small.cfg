# The parameters of easylocal_exam_timetabling, read with --config: one
# path = value per line, with the paths that --help lists. A switch on the
# command line wins over the file.

# Simulated Annealing cools from the initial to the final temperature,
# multiplied by the cooling rate at each level; allowed_iterations is the
# proposals of the whole annealing, spread over its levels.
runners.sa.temperature.initial_temperature = 100.0
runners.sa.temperature.final_temperature = 1.0
runners.sa.temperature.cooling_rate = 0.8
runners.sa.temperature.allowed_iterations = 200

# The weights of the penalty, in the order of main.cpp: student conflicts,
# consecutive exams, the load of the timeslots.
cost.weights = [1000, 10, 1]
