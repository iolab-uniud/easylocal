name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'include/**'
      - 'mkdocs.yml'
      - 'examples/quickstart/**' # served as downloads (scripts/mkdocs_downloads.py)
      - 'scripts/mkdocs_downloads.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'include/**'
      - 'mkdocs.yml'
      - 'examples/quickstart/**'
      - 'scripts/mkdocs_downloads.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Doxygen
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends doxygen

      # The Benchmarks page is rendered from the results of
      # iolab-uniud/easylocal-benchmarks, which starts this workflow after
      # publishing new ones.
      - name: Benchmark results
        run: |
          git clone -q --depth=1 https://github.com/iolab-uniud/easylocal-benchmarks.git \
            build/easylocal-benchmarks
          python3 build/easylocal-benchmarks/scripts/summarize.py \
            build/easylocal-benchmarks/results --output docs/benchmarks.md

      - name: Build
        run: |
          uv run --frozen mkdocs build --strict
          mkdir -p build/site-api
          doxygen docs/Doxyfile
          if [ -s build/site-api/warnings.log ]; then
            cat build/site-api/warnings.log >&2
            exit 1
          fi
          cp -R build/site-api/html build/site/api

      - name: Upload the site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Publish on GitHub Pages
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
