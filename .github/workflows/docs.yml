name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'include/**'
      - 'mkdocs.yml'
      - 'examples/quickstart/**' # served as downloads (scripts/mkdocs_downloads.py)
      - 'scripts/mkdocs_downloads.py'
      - 'scripts/api-docs.py'
      - 'scripts/docs-pdf.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:  # the same as for a push
      - 'docs/**'
      - 'include/**'
      - 'mkdocs.yml'
      - 'examples/quickstart/**'
      - 'scripts/mkdocs_downloads.py'
      - 'scripts/api-docs.py'
      - 'scripts/docs-pdf.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The API reference is generated by MrDocs, a released binary checked
      # against its digest.
      - name: Install MrDocs
        env:
          MRDOCS_RELEASE: 2026.9.29
          MRDOCS_SHA256: 9d96e42f303046fb0b221aa9071eabccc40b9683e0b7af2b02a929d15476ca6a
        run: |
          archive="MrDocs-$MRDOCS_RELEASE-Linux.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/cppalliance/mrdocs/releases/download/$MRDOCS_RELEASE/$archive"
          echo "$MRDOCS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mrdocs"
          tar xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mrdocs" --strip-components=1
          echo "MRDOCS=$RUNNER_TEMP/mrdocs/bin/mrdocs" >> "$GITHUB_ENV"

      # A build configured with every optional component: its compilation
      # database gives MrDocs the include paths of the adapters' dependencies.
      - name: Configure
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build g++-16
          cmake -S . -B build/api -G Ninja \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++-16 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DEASYLOCAL_ENABLE_CONFIG_TOML=ON \
            -DEASYLOCAL_ENABLE_TUI=ON \
            -DEASYLOCAL_ENABLE_REST=ON \
            -DEASYLOCAL_FETCH_DEPENDENCIES=ON

      # The Benchmarks page is rendered from the results of
      # iolab-uniud/easylocal-benchmarks, which starts this workflow after
      # publishing new ones.
      - name: Benchmark results
        run: |
          git clone -q --depth=1 https://github.com/iolab-uniud/easylocal-benchmarks.git \
            build/easylocal-benchmarks
          python3 build/easylocal-benchmarks/scripts/summarize.py \
            build/easylocal-benchmarks/results --output docs/benchmarks.md

      - name: Build
        run: |
          uv run --frozen mkdocs build --strict
          uv run --frozen scripts/api-docs.py build/api
          cp -R build/site-api build/site/api

      # One PDF per section of the nav, printed from the site by a headless
      # browser, published under pdf/ and linked from the pages.
      - name: Section PDFs
        run: |
          uv sync --frozen --group pdf
          uv run --frozen --group pdf playwright install --with-deps chromium
          uv run --frozen --group pdf scripts/docs-pdf.py
          mkdir -p build/site/pdf
          cp build/pdf/*.pdf build/site/pdf/

      - name: Upload the site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Publish on GitHub Pages
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
