name: CI

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux / ${{ matrix.toolchain }} / C++23
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc15, gcc16, clang22-libstdcxx, clang22-libcxx]
    env:
      PRESET: ci23-release
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workspace
        run: |
          printf 'Working directory: %s\n' "$PWD"
          printf 'GitHub workspace: %s\n' "$GITHUB_WORKSPACE"
          ls -l CMakeLists.txt CMakePresets.json VERSION
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f VERSION

      - name: Verify release tag matches VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "VERSION=$version but tag=$tag" >&2
            exit 1
          fi
          printf 'Release version: %s\n' "$version"

      - name: Provision Linux toolchain
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            elevate=()
          else
            elevate=(sudo)
          fi

          "${elevate[@]}" apt-get -o Acquire::Retries=3 update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build

          case "$TOOLCHAIN" in
            gcc15|gcc16)
              version="${TOOLCHAIN#gcc}"
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends "g++-${version}"
              echo "CXX=/usr/bin/g++-${version}" >> "$GITHUB_ENV"
              echo 'CXXFLAGS=' >> "$GITHUB_ENV"
              ;;
            clang22-libstdcxx)
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends g++-15 clang-22
              gcc_dir="$(dirname "$(/usr/bin/gcc-15 -print-libgcc-file-name)")"
              echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
              echo "CXXFLAGS=-stdlib=libstdc++ --gcc-install-dir=$gcc_dir" >> "$GITHUB_ENV"
              ;;
            clang22-libcxx)
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends \
                  clang-22 libc++-22-dev libc++abi-22-dev
              echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
              echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown toolchain: $TOOLCHAIN" >&2; exit 1 ;;
          esac

      - name: Environment
        run: |
          mkdir -p "build/$PRESET"
          {
            uname -a
            cat /etc/os-release
            cmake --version
            ninja --version
            "$CXX" --version
            echo "CXXFLAGS=${CXXFLAGS:-}"
          } 2>&1 | tee "build/$PRESET/environment.log"

      - name: Configure
        run: cmake --preset "$PRESET" 2>&1 | tee "build/$PRESET/configure.log"

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel 2 --verbose 2>&1 | tee "build/$PRESET/build.log"

      - name: Test (fast)
        run: ctest --preset "$PRESET" --verbose -LE integration 2>&1 | tee "build/$PRESET/ctest.log"

      - name: Test integration
        run: ctest --preset "$PRESET" --verbose -L integration 2>&1 | tee "build/$PRESET/ctest-integration.log"

      - name: Upload diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.toolchain }}-cxx23
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci23-release/*.log
            build/ci23-release/junit.xml
            build/ci23-release/CMakeCache.txt
            build/ci23-release/compile_commands.json
            build/ci23-release/CMakeFiles/CMakeConfigureLog.yaml
            build/ci23-release/Testing/Temporary/LastTest.log

  macos:
    name: macOS ARM64 / ${{ matrix.toolchain }} / C++23
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [appleclang, gcc16]
    env:
      PRESET: ci23-release
      TOOLCHAIN: ${{ matrix.toolchain }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workspace
        run: |
          printf 'Working directory: %s\n' "$PWD"
          printf 'GitHub workspace: %s\n' "$GITHUB_WORKSPACE"
          ls -l CMakeLists.txt CMakePresets.json VERSION
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f VERSION

      - name: Verify release tag matches VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "VERSION=$version but tag=$tag" >&2
            exit 1
          fi
          printf 'Release version: %s\n' "$version"

      - name: Provision native ARM64 toolchain
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo 'This job requires a native ARM64 macOS runner.' >&2
            exit 1
          fi
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          # The newest installed Xcode: EasyLocal needs a libc++ with
          # std::stop_token and floating-point std::from_chars.
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo 'CXXFLAGS=' >> "$GITHUB_ENV"
          case "$TOOLCHAIN" in
            appleclang)
              echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
              ;;
            gcc16)
              if ! brew list --versions gcc >/dev/null 2>&1; then
                brew install gcc
              fi
              compiler="$(brew --prefix gcc)/bin/g++-16"
              if [ ! -x "$compiler" ]; then
                echo "Missing GCC executable: $compiler" >&2
                exit 1
              fi
              echo "CXX=$compiler" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown toolchain: $TOOLCHAIN" >&2; exit 1 ;;
          esac

      - name: Environment
        run: |
          mkdir -p "build/$PRESET"
          {
            uname -a
            sw_vers
            xcodebuild -version
            echo "SDKROOT=$SDKROOT"
            cmake --version
            ninja --version
            "$CXX" --version
          } 2>&1 | tee "build/$PRESET/environment.log"

      - name: Configure
        run: cmake --preset "$PRESET" -DCMAKE_OSX_SYSROOT="$SDKROOT" 2>&1 | tee "build/$PRESET/configure.log"

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel 2 --verbose 2>&1 | tee "build/$PRESET/build.log"

      - name: Test (fast)
        run: ctest --preset "$PRESET" --verbose -LE integration 2>&1 | tee "build/$PRESET/ctest.log"

      - name: Test integration
        run: ctest --preset "$PRESET" --verbose -L integration 2>&1 | tee "build/$PRESET/ctest-integration.log"

      - name: Upload diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-${{ matrix.toolchain }}-cxx23
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci23-release/*.log
            build/ci23-release/junit.xml
            build/ci23-release/CMakeCache.txt
            build/ci23-release/compile_commands.json
            build/ci23-release/CMakeFiles/CMakeConfigureLog.yaml
            build/ci23-release/Testing/Temporary/LastTest.log

  coverage:
    name: Linux / GCC 16 / Debug coverage, all optional components
    permissions:
      contents: write  # the coverage badge on the badges branch
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CXX: /usr/bin/g++-16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        timeout-minutes: 10
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            elevate=()
          else
            elevate=(sudo)
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          "${elevate[@]}" apt-get "${apt_options[@]}" update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
            apt-get "${apt_options[@]}" install -y --no-install-recommends \
              cmake ninja-build g++-16 curl gcovr python3-pyte python3-pytest

      - name: Measure coverage
        run: |
          ./scripts/coverage.sh \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEASYLOCAL_ENABLE_CONFIG_TOML=ON \
            -DEASYLOCAL_ENABLE_TUI=ON \
            -DEASYLOCAL_ENABLE_REST=ON \
            -DEASYLOCAL_FETCH_DEPENDENCIES=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_tomlplusplus=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_ftxui=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_Crow=TRUE \
            2>&1 | tee coverage.log
          {
            echo '## Coverage of include/easylocal'
            echo '```'
            sed -n '/^lines:/,/^branches:/p' coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the coverage badge
        # The README badge reads badges/coverage.json (a shields.io endpoint)
        # from the badges branch; only runs on main update it.
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          percent="$(python3 -c "import json; print(round(json.load(open('build/coverage/summary.json'))['line_percent'], 1))")"
          color="$(python3 -c "p=$percent; print('brightgreen' if p >= 90 else 'green' if p >= 80 else 'yellowgreen' if p >= 70 else 'yellow' if p >= 60 else 'orange')")"
          badge_dir="$(mktemp -d)"
          cd "$badge_dir"
          git init -q -b badges
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$percent" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage: ${percent}% of include/easylocal lines (${GITHUB_SHA::7})"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            badges:badges
          echo "Coverage badge: ${percent}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-gcc16
          retention-days: 14
          if-no-files-found: warn
          path: |
            coverage.log
            build/coverage/coverage.txt
            build/coverage/coverage.xml
            build/coverage/summary.json
            build/coverage/html/
