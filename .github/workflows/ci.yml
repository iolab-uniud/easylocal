name: CI

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # pre-releases, such as v4.0.0-alpha.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux / ${{ matrix.toolchain }} / C++23
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - gcc15
          - gcc16
          - clang22-libstdcxx
          - clang23-libcxx
    env:
      PRESET: ci23-release
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workspace
        run: |
          printf 'Working directory: %s\n' "$PWD"
          printf 'GitHub workspace: %s\n' "$GITHUB_WORKSPACE"
          ls -l CMakeLists.txt CMakePresets.json VERSION
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f VERSION

      - name: Verify release tag matches VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "VERSION=$version but tag=$tag" >&2
            exit 1
          fi
          printf 'Release version: %s\n' "$version"

      - name: Provision Linux toolchain
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            elevate=()
          else
            elevate=(sudo)
          fi

          "${elevate[@]}" apt-get -o Acquire::Retries=3 update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build

          case "$TOOLCHAIN" in
            gcc15|gcc16)
              version="${TOOLCHAIN#gcc}"
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends "g++-${version}"
              echo "CXX=/usr/bin/g++-${version}" >> "$GITHUB_ENV"
              echo 'CXXFLAGS=' >> "$GITHUB_ENV"
              ;;
            clang22-libstdcxx)
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends g++-15 clang-22
              gcc_dir="$(dirname "$(/usr/bin/gcc-15 -print-libgcc-file-name)")"
              echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
              echo "CXXFLAGS=-stdlib=libstdc++ --gcc-install-dir=$gcc_dir" >> "$GITHUB_ENV"
              ;;
            clang23-libcxx)
              # Clang 23 is not in Ubuntu 26.04: it comes from the LLVM
              # project's own repository, apt.llvm.org.
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends ca-certificates curl
              "${elevate[@]}" install -d -m 0755 /etc/apt/keyrings
              curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key \
                | "${elevate[@]}" tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
              echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
                | "${elevate[@]}" tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
              "${elevate[@]}" apt-get -o Acquire::Retries=3 update
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends \
                  clang-23 libc++-23-dev libc++abi-23-dev
              echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"
              echo 'CXX=/usr/bin/clang++-23' >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown toolchain: $TOOLCHAIN" >&2; exit 1 ;;
          esac

      - name: Environment
        run: |
          mkdir -p "build/$PRESET"
          {
            uname -a
            cat /etc/os-release
            cmake --version
            ninja --version
            "$CXX" --version
            echo "CXXFLAGS=${CXXFLAGS:-}"
          } 2>&1 | tee "build/$PRESET/environment.log"

      - name: Configure
        run: cmake --preset "$PRESET" 2>&1 | tee "build/$PRESET/configure.log"

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel 2 --verbose 2>&1 | tee "build/$PRESET/build.log"

      - name: Test (fast)
        run: ctest --preset "$PRESET" --output-on-failure -j -LE integration 2>&1 | tee "build/$PRESET/ctest.log"

      - name: Test integration
        run: ctest --preset "$PRESET" --output-on-failure -j -L integration 2>&1 | tee "build/$PRESET/ctest-integration.log"

      - name: Upload diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.toolchain }}-cxx23
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci23-release/*.log
            build/ci23-release/junit.xml
            build/ci23-release/CMakeCache.txt
            build/ci23-release/compile_commands.json
            build/ci23-release/CMakeFiles/CMakeConfigureLog.yaml
            build/ci23-release/Testing/Temporary/LastTest.log

  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the format check compares with the pull request base

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build g++-15

      # The examples are fully formatted; elsewhere only the changed lines are
      # checked (scripts/format.sh): those of a pull request, or of the last
      # commit when the workflow is started by hand.
      - name: Format
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=HEAD~1
          if [ -n "$BASE_REF" ]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          fi
          scripts/format.sh --check "$base"

      - name: Lint the examples
        run: |
          cmake --preset dev -DCMAKE_CXX_COMPILER=g++-15
          scripts/tidy.sh build/dev

  macos:
    name: macOS ARM64 / ${{ matrix.toolchain }} / C++23
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [appleclang]
    env:
      PRESET: ci23-release
      TOOLCHAIN: ${{ matrix.toolchain }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify workspace
        run: |
          printf 'Working directory: %s\n' "$PWD"
          printf 'GitHub workspace: %s\n' "$GITHUB_WORKSPACE"
          ls -l CMakeLists.txt CMakePresets.json VERSION
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f VERSION

      - name: Verify release tag matches VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "VERSION=$version but tag=$tag" >&2
            exit 1
          fi
          printf 'Release version: %s\n' "$version"

      - name: Provision native ARM64 toolchain
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo 'This job requires a native ARM64 macOS runner.' >&2
            exit 1
          fi
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          # The newest installed Xcode: EasyLocal needs a libc++ with
          # std::stop_token and floating-point std::from_chars.
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo 'CXXFLAGS=' >> "$GITHUB_ENV"
          case "$TOOLCHAIN" in
            appleclang)
              echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown toolchain: $TOOLCHAIN" >&2; exit 1 ;;
          esac

      - name: Environment
        run: |
          mkdir -p "build/$PRESET"
          {
            uname -a
            sw_vers
            xcodebuild -version
            echo "SDKROOT=$SDKROOT"
            cmake --version
            ninja --version
            "$CXX" --version
          } 2>&1 | tee "build/$PRESET/environment.log"

      - name: Configure
        run: cmake --preset "$PRESET" -DCMAKE_OSX_SYSROOT="$SDKROOT" 2>&1 | tee "build/$PRESET/configure.log"

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel 2 --verbose 2>&1 | tee "build/$PRESET/build.log"

      - name: Test (fast)
        run: ctest --preset "$PRESET" --output-on-failure -j -LE integration 2>&1 | tee "build/$PRESET/ctest.log"

      - name: Test integration
        run: ctest --preset "$PRESET" --output-on-failure -j -L integration 2>&1 | tee "build/$PRESET/ctest-integration.log"

      - name: Upload diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-${{ matrix.toolchain }}-cxx23
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci23-release/*.log
            build/ci23-release/junit.xml
            build/ci23-release/CMakeCache.txt
            build/ci23-release/compile_commands.json
            build/ci23-release/CMakeFiles/CMakeConfigureLog.yaml
            build/ci23-release/Testing/Temporary/LastTest.log

  windows:
    name: Windows / ${{ matrix.toolchain }} / C++23
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - clang-cl
    env:
      PRESET: ci23-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision clang-cl and the MSVC environment
        shell: pwsh
        run: |
          # The newest LLVM (clang-cl) and Ninja; the Microsoft STL, Windows
          # SDK and linker come from the Visual Studio developer environment.
          choco upgrade llvm ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          "CXX=C:/Program Files/LLVM/bin/clang-cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CXXFLAGS=" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Environment
        run: |
          mkdir -p "build/$PRESET"
          {
            uname -a
            cmake --version
            ninja --version
            "$CXX" --version
          } 2>&1 | tee "build/$PRESET/environment.log"

      - name: Configure
        run: cmake --preset "$PRESET" 2>&1 | tee "build/$PRESET/configure.log"

      - name: Build
        run: cmake --build --preset "$PRESET" --parallel 4 --verbose 2>&1 | tee "build/$PRESET/build.log"

      - name: Test (fast)
        run: ctest --preset "$PRESET" --output-on-failure -j -LE integration 2>&1 | tee "build/$PRESET/ctest.log"

      - name: Test integration
        run: ctest --preset "$PRESET" --output-on-failure -j -L integration 2>&1 | tee "build/$PRESET/ctest-integration.log"

      - name: Upload diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.toolchain }}-cxx23
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci23-release/*.log
            build/ci23-release/junit.xml
            build/ci23-release/CMakeCache.txt
            build/ci23-release/compile_commands.json
            build/ci23-release/CMakeFiles/CMakeConfigureLog.yaml
            build/ci23-release/Testing/Temporary/LastTest.log

  coverage:
    name: Linux / GCC 16 / Debug coverage, all optional components
    permissions:
      contents: write  # the coverage badge on the badges branch
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CXX: /usr/bin/g++-16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        timeout-minutes: 10
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            elevate=()
          else
            elevate=(sudo)
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          "${elevate[@]}" apt-get "${apt_options[@]}" update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
            apt-get "${apt_options[@]}" install -y --no-install-recommends \
              cmake ninja-build g++-16 curl

      # gcovr, pyte and pytest from uv.lock, as in local runs of the script.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The script measures GCC ($CXX) with every optional component.
      - name: Measure coverage
        run: |
          ./scripts/coverage.sh 2>&1 | tee coverage.log
          {
            echo '## Coverage of include/easylocal'
            echo '```'
            sed -n '/^lines:/,/^branches:/p' coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the coverage badge
        # The README badge reads badges/coverage.json (a shields.io endpoint)
        # from the badges branch; only runs on main update it.
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          percent="$(python3 -c "import json; print(round(json.load(open('build/coverage/summary.json'))['line_percent'], 1))")"
          color="$(python3 -c "p=$percent; print('brightgreen' if p >= 90 else 'green' if p >= 80 else 'yellowgreen' if p >= 70 else 'yellow' if p >= 60 else 'orange')")"
          badge_dir="$(mktemp -d)"
          cd "$badge_dir"
          git init -q -b badges
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$percent" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage: ${percent}% of include/easylocal lines (${GITHUB_SHA::7})"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            badges:badges
          echo "Coverage badge: ${percent}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-gcc16
          retention-days: 14
          if-no-files-found: warn
          path: |
            coverage.log
            build/coverage/coverage.txt
            build/coverage/coverage.xml
            build/coverage/summary.json
            build/coverage/html/
