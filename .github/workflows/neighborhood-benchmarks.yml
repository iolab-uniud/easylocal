name: Neighborhood Benchmarks

on:
  workflow_dispatch:
    inputs:
      target_work:
        description: Approximate moves/evaluations measured per benchmark row/trial
        required: true
        type: string
        default: '1000000'
      trials:
        description: Number of timing trials per benchmark case
        required: true
        type: string
        default: '3'
      seed:
        description: Runtime seed used to build benchmark data
        required: true
        type: string
        default: '123456789'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BENCHMARK_TARGET_WORK: ${{ github.event.inputs.target_work }}
  BENCHMARK_TRIALS: ${{ github.event.inputs.trials }}
  BENCHMARK_SEED: ${{ github.event.inputs.seed }}

jobs:
  linux:
    name: Linux / ${{ matrix.toolchain }} / neighborhood benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc15, gcc16, clang22-libstdcxx, clang22-libcxx]
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision Linux toolchain
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            elevate=()
          else
            elevate=(sudo)
          fi

          apt_update() {
            local attempt
            for attempt in 1 2 3 4; do
              if "${elevate[@]}" apt-get -o Acquire::Retries=3 update; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                return 1
              fi
              echo "apt-get update failed (attempt ${attempt}/4); retrying..." >&2
              sleep $((attempt * 5))
            done
          }

          apt_update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends cmake ninja-build python3

          case "$TOOLCHAIN" in
            gcc15|gcc16)
              version="${TOOLCHAIN#gcc}"
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends "g++-${version}"
              echo "CXX=/usr/bin/g++-${version}" >> "$GITHUB_ENV"
              echo 'CXXFLAGS=' >> "$GITHUB_ENV"
              ;;
            clang22-libstdcxx)
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends g++-15 clang-22
              gcc_dir="$(dirname "$(/usr/bin/gcc-15 -print-libgcc-file-name)")"
              echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
              echo "CXXFLAGS=-stdlib=libstdc++ --gcc-install-dir=$gcc_dir" >> "$GITHUB_ENV"
              ;;
            clang22-libcxx)
              "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y --no-install-recommends \
                  clang-22 libc++-22-dev libc++abi-22-dev
              echo 'CXX=/usr/bin/clang++-22' >> "$GITHUB_ENV"
              echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown toolchain: $TOOLCHAIN" >&2; exit 1 ;;
          esac

      - name: Run benchmark suite
        run: |
          results_dir="build/neighborhood-benchmark-results"
          ./scripts/run-neighborhood-benchmarks.sh \
            "$results_dir" \
            "$BENCHMARK_TARGET_WORK" \
            "$BENCHMARK_TRIALS" \
            "$BENCHMARK_SEED"
          cat "$results_dir/traversal.log"
          cat "$results_dir/search.log"
          cat "$results_dir/summary.md"

      - name: Upload benchmark results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neighborhood-benchmark-linux-${{ matrix.toolchain }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/neighborhood-benchmark-results/*.log
            build/neighborhood-benchmark-results/*.csv
            build/neighborhood-benchmark-results/*.md

  macos:
    name: macOS ARM64 / ${{ matrix.toolchain }} / neighborhood benchmark
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [appleclang, gcc16]
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision native ARM64 toolchain
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo 'This job requires a native ARM64 macOS runner.' >&2
            exit 1
          fi
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v python3 >/dev/null
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo 'CXXFLAGS=' >> "$GITHUB_ENV"
          case "$TOOLCHAIN" in
            appleclang)
              echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
              ;;
            gcc16)
              if ! brew list --versions gcc >/dev/null 2>&1; then
                brew install gcc
              fi
              compiler="$(brew --prefix gcc)/bin/g++-16"
              if [ ! -x "$compiler" ]; then
                echo "Missing GCC executable: $compiler" >&2
                exit 1
              fi
              echo "CXX=$compiler" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown toolchain: $TOOLCHAIN" >&2; exit 1 ;;
          esac

      - name: Run benchmark suite
        run: |
          results_dir="build/neighborhood-benchmark-results"
          ./scripts/run-neighborhood-benchmarks.sh \
            "$results_dir" \
            "$BENCHMARK_TARGET_WORK" \
            "$BENCHMARK_TRIALS" \
            "$BENCHMARK_SEED"
          cat "$results_dir/traversal.log"
          cat "$results_dir/search.log"
          cat "$results_dir/summary.md"

      - name: Upload benchmark results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neighborhood-benchmark-macos-arm64-${{ matrix.toolchain }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/neighborhood-benchmark-results/*.log
            build/neighborhood-benchmark-results/*.csv
            build/neighborhood-benchmark-results/*.md
