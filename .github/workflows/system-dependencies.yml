name: System Dependencies

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-config-toml:
    name: Linux / ConfigTOML / system dependencies only
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            elevate=()
          else
            elevate=(sudo)
          fi
          "${elevate[@]}" apt-get -o Acquire::Retries=3 update
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              cmake ninja-build g++-16 libtomlplusplus-dev
          echo 'CXX=/usr/bin/g++-16' >> "$GITHUB_ENV"

      - name: Configure without FetchContent
        run: |
          build_dir="build/system-deps-toml"
          cmake -S . -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DEASYLOCAL_BUILD_EXAMPLES=OFF \
            -DEASYLOCAL_BUILD_TESTS=ON \
            -DEASYLOCAL_ENABLE_CONFIG_TOML=ON \
            -DEASYLOCAL_FETCH_DEPENDENCIES=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            2>&1 | tee "${build_dir}.configure.log"
          test ! -e "$build_dir/_deps"

      - name: Build and test ConfigTOML
        run: |
          build_dir="build/system-deps-toml"
          cmake --build "$build_dir" --parallel 2 --verbose \
            --target \
              easylocal_configuration_toml_header_self_containment \
              easylocal_configuration_toml_test \
            2>&1 | tee "${build_dir}.build.log"
          ctest --test-dir "$build_dir" --verbose \
            -R 'easylocal\.(configuration-toml(-header-self-containment)?|installed-package-consumer)$' \
            2>&1 | tee "${build_dir}.ctest.log"

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-deps-linux-config-toml
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/system-deps-toml*.log
            build/system-deps-toml/CMakeCache.txt
            build/system-deps-toml/CMakeFiles/CMakeConfigureLog.yaml
            build/system-deps-toml/Testing/Temporary/LastTest.log

  macos-config-toml-tui:
    name: macOS ARM64 / ConfigTOML + TUI / system dependencies only
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo 'This job requires a native ARM64 macOS runner.' >&2
            exit 1
          fi
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          brew list --versions tomlplusplus >/dev/null 2>&1 || brew install tomlplusplus
          brew list --versions ftxui >/dev/null 2>&1 || brew install ftxui
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"

      - name: Configure without FetchContent
        run: |
          build_dir="build/system-deps-toml-tui"
          prefix_path="$(brew --prefix tomlplusplus);$(brew --prefix ftxui)"
          cmake -S . -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DEASYLOCAL_BUILD_EXAMPLES=OFF \
            -DEASYLOCAL_BUILD_TESTS=ON \
            -DEASYLOCAL_ENABLE_CONFIG_TOML=ON \
            -DEASYLOCAL_ENABLE_TUI=ON \
            -DEASYLOCAL_FETCH_DEPENDENCIES=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            2>&1 | tee "${build_dir}.configure.log"
          test ! -e "$build_dir/_deps"

      - name: Build and test ConfigTOML and TUI
        run: |
          build_dir="build/system-deps-toml-tui"
          cmake --build "$build_dir" --parallel 2 --verbose \
            --target \
              easylocal_configuration_toml_header_self_containment \
              easylocal_configuration_toml_test \
              easylocal_tui_header_self_containment \
              easylocal_tui_tester_compile_test \
              easylocal_tui_helpers_test \
              easylocal_tui_launcher_header_self_containment \
              easylocal_tui_launcher_helpers_test \
            2>&1 | tee "${build_dir}.build.log"
          ctest --test-dir "$build_dir" --verbose \
            -R 'easylocal\.(configuration-toml(-header-self-containment)?|tui-.*|installed-package-consumer)$' \
            2>&1 | tee "${build_dir}.ctest.log"

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-deps-macos-config-toml-tui
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/system-deps-toml-tui*.log
            build/system-deps-toml-tui/CMakeCache.txt
            build/system-deps-toml-tui/CMakeFiles/CMakeConfigureLog.yaml
            build/system-deps-toml-tui/Testing/Temporary/LastTest.log
