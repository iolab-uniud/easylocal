# Recall to use act --container-architecture linux/amd64 for testing the action on MacOS

name: Amalgamate Headers into a single header file with Heady (server side)

on:
    push:
        branches:
            - development
            - main
    pull_request:
        branches:
            - development
            - main

jobs:
    merge-headers:
        runs-on: ubuntu-latest
        
        steps:
            - uses: actions/checkout@v2

            - name: Check file modification times
              id: check_for_changes
              run: |
                amalgamated_header_mtime=$(stat -c %Y include/easylocal.hh)
                newest_include_mtime=0
                for file in ./src/include/easylocal/*.hh; do
                  file_mtime=$(stat -c %Y "$file")
                  if [ "$file_mtime" -gt "$newest_include_mtime" ]; then
                    newest_include_mtime="$file_mtime"
                  fi
                done
                if [ "$amalgamated_header_mtime" -lt "$newest_include_mtime" ]; then
                  echo "Amalgamated header is outdated"
                  echo "::set-output name=should_regenerate::true"
                else
                  echo "Amalgamated header is up-to-date"
                fi

            - name: Cache Heady Build
              if: steps.check_for_changes.outputs.should_regenerate == 'true'
              uses: actions/cache@v2
              with:
                path: |
                    Heady/build
                key: ${{ runner.os }}-heady-build-${{ hashFiles('src/include/**/*.hh') }}
                restore-keys: |
                    ${{ runner.os }}-heady-build-            

            - name: Install dependencies (ignoring Microsoft repo)
              if: steps.check_for_changes.outputs.should_regenerate == 'true'
              run: |
                sudo find /etc/apt/sources.list.d/ -type f -name '*microsoft*' -exec sudo sed -i 's/^deb/#deb/' {} \;
                sudo apt update -y 
                sudo apt install -y build-essential cmake

            - name: Install Heady
              if: steps.check_for_changes.outputs.should_regenerate == 'true'
              run: |
                if [ ! -d "Heady/build" ]; then
                    git clone https://github.com/JamesBoer/Heady.git
                    cd Heady
                    mkdir build
                    cd build
                    cmake -DCMAKE_CXX_FLAGS="-Wno-error=maybe-uninitialized" ..
                    make -j       
                fi                     

            - name: Run Heady to merge headers
              if: steps.check_for_changes.outputs.should_regenerate == 'true'
              run: |
                echo "Aggregating headers"
                Heady/build/Heady -r -s ./src/include/easylocal -o include/easylocal.hh

            - name: Commit and push if changed
              if: steps.check_for_changes.outputs.should_regenerate == 'true'
              run: |
                git config --global user.email "action@github.com"
                git config --global user.name "GitHub Action"
                git add ./include/easylocal.hh
                git commit -m "Update single header file" || echo "No changes to commit"
                git push origin ${GITHUB_REF##*/}
            