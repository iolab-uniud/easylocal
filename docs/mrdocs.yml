# MrDocs configuration of the generated API reference, served under api/.
# scripts/api-docs.py runs it with the compilation database it writes; paths
# are relative to this file.
source-root: ../include
input:
  - ../include/easylocal
recursive: true
file-patterns:
  - '*.hpp'
exclude-patterns:
  - '**/detail/**'
  - '**/third_party/**'
exclude-symbols:
  - 'easylocal::detail'
  - 'easylocal::detail::**'
  - 'easylocal::**::detail'
  - 'easylocal::**::detail::**'
# MrDocs 0.8.0 drops every function of an overload set from the pages when it
# groups them: each overload has a page of its own.
overloads: false
# The members of a base class are not copied to the pages of the derived
# classes: the public classes derive only from classes of detail (whose
# members they re-export with a documented using-declaration) and of std.
inherit-base-members: never
generator: html
multipage: true
# The look of the documentation site: mrdocs/ overrides the page layout and
# replaces the default stylesheet.
addons-supplemental:
  - mrdocs
no-default-styles: true
stylesheets:
  - mrdocs/easylocal.css
linkcss: true
copycss: true
# A warning fails the build: a malformed comment, or a public declaration
# (an enum value included) without one. Parameters and return values are
# explained in the text of the comment.
warnings: true
warn-as-error: true
warn-if-doc-error: true
warn-if-undocumented: true
warn-no-paramdoc: false
warn-if-undoc-enum-val: true
# No comment written by MrDocs for special members: a constructor, an
# assignment or a deleted member without its own comment fails the build.
auto-function-metadata: false
